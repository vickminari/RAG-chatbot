# Docker Compose para PRODUÇÃO (EC2 t3.micro)
# Usa apenas backend + Nginx servindo frontend estático

services:
  backend-genai-chatbot:
    build: ./backend
    container_name: genai-chatbot-backend
    image: genai-chatbot-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/chat.db
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - INDEXER_SECRET_KEY=${INDEXER_SECRET_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: genai-chatbot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend-genai-chatbot

networks:
  app-network:
    driver: bridge

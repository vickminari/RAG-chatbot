services:
  backend-genai-chatbot:
    build: ./backend
    container_name: genai-chatbot-backend
    image: genai-chatbot-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    restart: unless-stopped
    networks:
      - app-network

